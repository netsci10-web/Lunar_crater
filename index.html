<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달 충돌구 탐색기 (Moon Crater Explorer)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
        }

        #map {
            height: 100%;
            width: 100%;
            border-radius: 0.5rem;
            background-color: #000; 
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .custom-crater-marker { pointer-events: none; }
        
        /* 로딩 스피너 애니메이션 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6; 
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 shadow-md p-4 flex items-center justify-between z-10 relative">
        <div id="appLogo" class="flex items-center gap-3 cursor-pointer group select-none" title="지도 위치 초기화">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400 group-hover:scale-110 transition-transform"><path d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Z"/><path d="M14 6c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2z"/><path d="M9 13.5c0 1.4-1.1 2.5-2.5 2.5S4 14.9 4 13.5 5.1 11 6.5 11s2.5 1.1 2.5 2.5z"/><path d="M19 16c0 1.6-1.3 3-3 3s-3-1.4-3-3 1.3-3 3-3 3 1.3 3 3z"/></svg>
            <h1 class="text-2xl font-bold tracking-tight group-hover:text-blue-400 transition-colors">Moon Crater Explorer</h1>
        </div>
        <p class="text-sm text-slate-400 hidden sm:block">전체 달 충돌구 데이터베이스 뷰어</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-80 bg-slate-800 border-r border-slate-700 flex flex-col h-1/3 md:h-full transition-all duration-300 z-10 flex-shrink-0">
            <div class="p-4 border-b border-slate-700">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <h2 class="text-lg font-semibold text-slate-200 whitespace-nowrap">충돌구 목록 (<span id="craterCount">0</span>)</h2>
                        <!-- 홈 아이콘 버튼 -->
                        <button id="homeBtn" title="지도 위치 초기화" class="p-1 rounded-md text-slate-400 hover:text-blue-400 hover:bg-slate-700 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        </button>
                    </div>
                    <label class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer hover:text-slate-200 select-none">
                        <input type="checkbox" id="locationOnlyMode" class="w-4 h-4 rounded border-slate-600 bg-slate-900 text-blue-500 focus:ring-blue-500">
                        지도위치
                    </label>
                </div>
                <div class="relative mb-3">
                    <input type="text" id="searchInput" placeholder="이름으로 검색 (예: Tycho)..." class="w-full bg-slate-900 border border-slate-600 rounded-md py-2 px-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 placeholder-slate-500">
                </div>
                
                <!-- DB 다운로드 및 동기화 버튼 -->
                <button id="refreshDbBtn" class="w-full bg-blue-600/20 hover:bg-blue-600/40 border border-blue-500/50 text-blue-300 text-sm font-medium py-2 px-4 rounded-md transition-colors flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    서버에서 최신 DB 가져오기
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1" id="craterList">
                <!-- List populated via JS -->
            </div>
        </aside>

        <!-- Map Section -->
        <section class="flex-1 relative flex flex-col bg-black">
            <div id="map-container" class="flex-1 relative z-0">
                <!-- 로딩 오버레이 -->
                <div id="loadingOverlay" class="absolute inset-0 bg-black/80 flex items-center justify-center z-[1000] hidden">
                    <div class="flex flex-col items-center gap-3">
                        <div class="loader"></div>
                        <p class="text-slate-300 font-medium text-center px-4" id="loadingText">데이터를 분석하고 있습니다...</p>
                    </div>
                </div>
                <div id="map"></div>
            </div>

            <!-- Info Panel -->
            <div id="infoPanel" class="absolute bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-sm border-t border-slate-700 p-4 md:p-6 transform translate-y-full transition-transform duration-300 ease-in-out z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                <button id="closeInfoBtn" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                
                <div class="flex flex-col md:flex-row gap-6 max-w-5xl mx-auto items-start">
                    <div class="flex-1 space-y-3">
                        <h3 class="text-2xl md:text-3xl font-bold text-white flex items-center flex-wrap gap-3">
                            <span id="craterName">--</span>
                            <span id="craterDiameter" class="text-sm font-normal bg-blue-900/50 text-blue-300 px-2 py-1 rounded border border-blue-800">--</span>
                        </h3>
                        <p id="craterDesc" class="text-slate-300 leading-relaxed text-sm md:text-base italic">
                            달의 주요 지형 데이터를 확인하세요.
                        </p>
                        
                        <div class="grid grid-cols-2 gap-4 mt-4 bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                            <div>
                                <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">위도 (Latitude)</span>
                                <span id="craterLat" class="font-mono text-slate-200 text-sm">--</span>
                            </div>
                            <div>
                                <span class="block text-xs text-slate-400 uppercase tracking-wider mb-1">경도 (Longitude)</span>
                                <span id="craterLng" class="font-mono text-slate-200 text-sm">--</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        const DB_URL = "https://netsci10-web.github.io/Lunar_crater/Lunar_Impact_Crater_Database_v08Sep2015.csv";
        const STORAGE_KEY = "lunar_craters_db";

        let cratersData = [];
        let map, currentMarker = null;
        let allCratersLayer; 
        
        // DOM 요소
        const listEl = document.getElementById('craterList');
        const locationOnlyMode = document.getElementById('locationOnlyMode');
        const searchInput = document.getElementById('searchInput');
        const infoPanel = document.getElementById('infoPanel');
        const appLogo = document.getElementById('appLogo');
        const homeBtn = document.getElementById('homeBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const refreshDbBtn = document.getElementById('refreshDbBtn');

        const fallbackCraters = [
            { name: 'Tycho', lat: -43.3, lng: -11.2, diameter: 86.2, description: '데이터 로드 실패 - 기본 데이터 표시 중' },
            { name: 'Copernicus', lat: 9.6, lng: -20.1, diameter: 96.1, description: '데이터 로드 실패 - 기본 데이터 표시 중' }
        ];

        function init() {
            // Setup Map
            map = L.map('map', {
                crs: L.CRS.EPSG4326,
                center: [0, 0],
                zoom: 2,
                minZoom: 2,
                maxZoom: 8.1, // 최대 확대 레벨 8.1로 제한
                zoomSnap: 0.1, // 소수점 배율이 가능하도록 스냅 속성 추가
                zoomControl: false,
                attributionControl: false,
                preferCanvas: true 
            });

            L.control.zoom({ position: 'topright' }).addTo(map);
            
            // 지도 하단에 축척(Scale) 추가
            L.control.scale({
                position: 'bottomleft',
                metric: true,    // 미터/킬로미터 표시
                imperial: true,  // 피트/마일 표시
                maxWidth: 200    // 축척 바의 최대 픽셀 너비
            }).addTo(map);

            allCratersLayer = L.featureGroup().addTo(map);

            // NASA 타일이 특정 줌 이상(보통 10) 지원하지 않을 때 발생하는 오류 방지용 maxNativeZoom 추가
            L.tileLayer('https://trek.nasa.gov/tiles/Moon/EQ/LRO_WAC_Mosaic_Global_303ppd_v02/1.0.0/default/default028mm/{z}/{y}/{x}.jpg', {
                noWrap: true,
                bounds: [[-90, -180], [90, 180]],
                maxNativeZoom: 8, // 줌 레벨 8 이상의 타일은 자체 확대하여 깨짐 방지
                maxZoom: 8.1
            }).addTo(map);

            appLogo.onclick = resetMapView;
            homeBtn.onclick = resetMapView;

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = cratersData.filter(c => 
                    c.name.toLowerCase().includes(term) || 
                    c.description.toLowerCase().includes(term)
                );
                renderList(filtered);
            });

            document.getElementById('closeInfoBtn').onclick = () => {
                infoPanel.classList.add('translate-y-full');
                if (currentMarker) map.removeLayer(currentMarker);
            };

            // 수동으로 서버에서 최신 DB 다운로드
            refreshDbBtn.onclick = () => {
                localStorage.removeItem(STORAGE_KEY);
                fetchAndStoreCSV();
            };

            // 앱 시작 시 데이터 자동 로드
            loadCratersData();
        }

        // 로컬 저장소 우선 확인 후 다운로드 결정
        async function loadCratersData() {
            const cached = localStorage.getItem(STORAGE_KEY);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    // 과거 데이터에 NaN(직렬화 시 null)이 들어가 오류를 일으켰던 것을 방지
                    if (parsed && parsed.length > 0 && typeof parsed[0].lat === 'number') {
                        cratersData = parsed;
                        updateAppUI();
                        resetMapView(); // 캐시 로드 후 지도 초기화 (이벤트 객체 없이 호출되어 setView로 작동)
                        return; 
                    } else {
                        // 잘못된 캐시 데이터 폐기
                        localStorage.removeItem(STORAGE_KEY);
                    }
                } catch (e) {
                    console.error("캐시 데이터 파싱 오류", e);
                    localStorage.removeItem(STORAGE_KEY);
                }
            }
            
            await fetchAndStoreCSV();
        }

        // 지정된 URL에서 CSV를 받아오고 분석
        async function fetchAndStoreCSV() {
            loadingOverlay.classList.remove('hidden');
            loadingText.textContent = "서버에서 달 충돌구 데이터베이스를 다운로드하고 있습니다...";

            try {
                const response = await fetch(DB_URL);
                if (!response.ok) throw new Error("네트워크 응답 오류");
                
                const csvText = await response.text();
                
                loadingText.textContent = "데이터를 분석하여 사용자 기기에 저장하고 있습니다...";
                setTimeout(() => {
                    parseLunarCSV(csvText);
                }, 100);
            } catch (error) {
                console.error("CSV 다운로드 실패:", error);
                cratersData = fallbackCraters;
                updateAppUI();
                loadingOverlay.classList.add('hidden');
                alert("데이터 다운로드에 실패하여 임시 데이터를 표시합니다.");
            }
        }

        // 사용자 제공 CSV 파일 파싱 엔진
        function parseLunarCSV(csvText) {
            const lines = csvText.split(/\r\n|\n/);
            const newCraters = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const cols = [];
                let current = '';
                let inQuotes = false;
                
                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        cols.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                cols.push(current.trim()); 
                
                if (cols.length < 4) continue;
                
                let name = cols[0].replace(/^"|"$/g, '').trim();
                const dia = parseFloat(cols[1]);
                const lat = parseFloat(cols[2]);
                const lng = parseFloat(cols[3]);
                
                if (name && !isNaN(dia) && dia >= 10.0 && !isNaN(lat) && !isNaN(lng)) {
                    newCraters.push({
                        name: name,
                        lat: lat,
                        lng: lng,
                        diameter: dia,
                        description: `데이터베이스 분석 결과: 직경 ${dia.toFixed(1)}km 의 충돌구입니다.`
                    });
                }
            }
            
            if (newCraters.length > 0) {
                newCraters.sort((a, b) => a.name.localeCompare(b.name));
                cratersData = newCraters;
                
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(cratersData));
                } catch(e) {
                    console.warn("로컬 저장소 용량이 부족하여 데이터를 캐시하지 못했습니다.");
                }
                
                updateAppUI();
                resetMapView(); // 파싱 후 지도 초기 위치 설정
            } else {
                alert("해당 파일에서 10km 이상의 충돌구 데이터를 찾을 수 없습니다.");
            }
            
            loadingOverlay.classList.add('hidden');
        }

        function updateAppUI() {
            document.getElementById('craterCount').textContent = cratersData.length.toLocaleString();
            renderList(cratersData);
            drawAllCratersOnMap();
        }

        function drawAllCratersOnMap() {
            allCratersLayer.clearLayers();
            
            cratersData.forEach(crater => {
                const visualRadius = Math.max(crater.diameter * 500, 10000); 
                
                const circle = L.circle([crater.lat, crater.lng], {
                    color: '#3b82f6',
                    fillColor: '#3b82f6',
                    fillOpacity: 0.1,
                    weight: 1,
                    radius: visualRadius 
                });
                circle.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    selectCrater(crater);
                });
                allCratersLayer.addLayer(circle);
            });
        }

        // 지도의 위치와 배율만 초기 상태로 리셋하는 함수
        function resetMapView(e) {
            // 버튼 클릭 등 사용자 이벤트로 호출된 경우에만 애니메이션 적용 (초기 로딩 시 NaN 에러 방지)
            if (e && e.type) {
                map.flyTo([0, 0], 2, { duration: 1.5 });
            } else {
                map.setView([0, 0], 2);
            }
        }

        function renderList(data) {
            listEl.innerHTML = '';
            if (data.length === 0) {
                listEl.innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">검색 결과가 없습니다.</div>';
                return;
            }
            
            const maxDisplay = 1000;
            const displayData = data.slice(0, maxDisplay);
            
            const fragment = document.createDocumentFragment();
            
            displayData.forEach(crater => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 rounded-md hover:bg-slate-700 transition-all flex flex-col gap-1 border border-transparent hover:border-slate-600 focus:outline-none mb-1 group';
                btn.innerHTML = `
                    <span class="font-medium text-slate-100 group-hover:text-blue-400">${crater.name}</span>
                    <span class="text-xs text-slate-400">지름: ${crater.diameter.toFixed(1)} km</span>
                `;
                btn.onclick = () => selectCrater(crater);
                fragment.appendChild(btn);
            });
            
            if (data.length > maxDisplay) {
                const notice = document.createElement('div');
                notice.className = 'p-3 text-center text-slate-500 text-xs mt-2';
                notice.textContent = `목록 렌더링 성능을 위해 상위 1,000개만 표시합니다. 전체 ${data.length.toLocaleString()}개의 데이터는 검색을 통해 모두 확인할 수 있습니다. (지도 위에는 모두 표시됨)`;
                fragment.appendChild(notice);
            }
            
            listEl.appendChild(fragment);
        }

        function selectCrater(crater) {
            document.getElementById('craterName').textContent = crater.name;
            document.getElementById('craterDiameter').textContent = `지름 ${crater.diameter.toFixed(1)} km`;
            document.getElementById('craterDesc').textContent = crater.description;
            
            const latStr = `${Math.abs(crater.lat).toFixed(2)}° ${crater.lat >= 0 ? 'N' : 'S'}`;
            const lngStr = `${Math.abs(crater.lng).toFixed(2)}° ${crater.lng >= 0 ? 'E' : 'W'}`;
            document.getElementById('craterLat').textContent = latStr;
            document.getElementById('craterLng').textContent = lngStr;

            const targetPos = L.latLng(crater.lat, crater.lng);
            
            const isLocationOnly = locationOnlyMode.checked;
            let targetZoom;
            
            if (isLocationOnly) {
                targetZoom = map.getMinZoom(); 
            } else {
                const dia = crater.diameter;
                // 최대 줌 레벨이 8.1을 넘지 않도록 조정
                if (dia > 0) {
                    if (dia <= 30) targetZoom = 8.1;     // 최대 확대 제한
                    else if (dia <= 60) targetZoom = 8;
                    else if (dia <= 120) targetZoom = 7;
                    else if (dia <= 250) targetZoom = 6;
                    else targetZoom = 5;                 // 거대 분지
                } else {
                    targetZoom = 8.1;
                }
            }

            const yOffset = window.innerWidth < 768 ? 160 : 130;
            const targetPoint = map.project(targetPos, targetZoom);
            targetPoint.y += yOffset;
            const offsetLatLng = map.unproject(targetPoint, targetZoom);

            map.flyTo(offsetLatLng, targetZoom, { 
                duration: 1.5,
                easeLinearity: 0.25
            });

            if (currentMarker) map.removeLayer(currentMarker);
            const icon = L.divIcon({
                className: 'custom-crater-marker',
                html: `<div class="relative w-8 h-8 flex items-center justify-center">
                            <div class="absolute inset-0 border-2 border-red-500 rounded-full animate-ping opacity-75"></div>
                            <div class="w-3 h-3 bg-red-500 rounded-full shadow-[0_0_15px_rgba(239,68,68,1)] border border-white"></div>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            currentMarker = L.marker(targetPos, { icon }).addTo(map);
            infoPanel.classList.remove('translate-y-full');
        }

        window.onload = init;
    </script>
</body>
</html>
